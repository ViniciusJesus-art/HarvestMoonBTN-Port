name: Native installers (AppImage, DEB, RPM, EXE)

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Formato ou plataforma'
        type: choice
        options: [Todos, Linux, Windows, AppImage, RPM, DEB, EXE]
        default: Todos
      publication:
        description: 'Destino dos pacotes'
        type: choice
        options: [Teste, Release]
        default: Teste
      tag:
        description: 'Nova tag da Release (obrigatoria apenas para Release, ex. native-v0.1.0)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          PUBLICATION: ${{ inputs.publication }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$PUBLICATION" = Release ]; then
            if [[ ! "$RELEASE_TAG" =~ ^native-v[0-9][A-Za-z0-9._-]*$ ]]; then
              echo 'Informe uma nova tag no formato native-v0.1.0.' >&2
              exit 1
            fi
          fi

  linux:
    needs: validate
    if: ${{ contains(fromJSON('["Todos","Linux","AppImage","RPM","DEB"]'), inputs.package) }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build tools and runtime library headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build rpm dpkg-dev pkg-config file desktop-file-utils libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libxrender-dev libudev-dev libdbus-1-dev libasound2-dev libpulse-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure native release (no disc or PS1 toolchain)
        run: cmake -S . -B build/native-package -G Ninja -DHMBTN_BUILD_NATIVE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON
      - name: Build and test
        run: |
          cmake --build build/native-package --parallel 2
          ctest --test-dir build/native-package --output-on-failure
      - name: Build DEB
        if: ${{ contains(fromJSON('["Todos","Linux","DEB"]'), inputs.package) }}
        run: cpack --config build/native-package/CPackConfig.cmake -G DEB -B build/artifacts
      - name: Build RPM
        if: ${{ contains(fromJSON('["Todos","Linux","RPM"]'), inputs.package) }}
        run: cpack --config build/native-package/CPackConfig.cmake -G RPM -B build/artifacts
      - name: Stage AppImage runtime and audit contents
        if: ${{ contains(fromJSON('["Todos","Linux","AppImage"]'), inputs.package) }}
        run: |
          cmake --install build/native-package --prefix "$PWD/build/AppDir/usr"
          python3 port/packaging/audit_payload.py build/AppDir
          python3 port/packaging/download_appimage_tools.py build/appimage-tools
      - name: Build AppImage with bundled SDL backends
        if: ${{ contains(fromJSON('["Todos","Linux","AppImage"]'), inputs.package) }}
        run: |
          python3 port/packaging/appimage.py build/AppDir build/artifacts/HarvestMoonBTN-linux-x86_64.AppImage --tool build/appimage-tools/appimagetool.AppImage --runtime build/appimage-tools/runtime-x86_64
          python3 port/packaging/audit_payload.py build/AppDir
      - name: Smoke test staged runtime and AppImage without FUSE
        if: ${{ contains(fromJSON('["Todos","Linux","AppImage"]'), inputs.package) }}
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
        run: |
          build/AppDir/usr/bin/hmbtn_native --diagnostics
          build/artifacts/HarvestMoonBTN-linux-x86_64.AppImage --appimage-extract-and-run --window-test --frames 3
      - name: Checksums
        working-directory: build/artifacts
        run: |
          find . -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: HarvestMoonBTN-linux-x64
          path: |
            build/artifacts/*.AppImage
            build/artifacts/*.deb
            build/artifacts/*.rpm
            build/artifacts/SHA256SUMS-linux.txt
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: validate
    if: ${{ contains(fromJSON('["Todos","Windows","EXE"]'), inputs.package) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure Windows x64 with static SDL and CRT
        run: cmake -S . -B build/native-package -A x64 -DHMBTN_BUILD_NATIVE=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON
      - name: Build and test
        run: |
          cmake --build build/native-package --config Release --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/native-package -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage runtime (no repository or disc files)
        run: |
          cmake --install build/native-package --config Release --prefix build/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python port/packaging/audit_payload.py build/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create per-user EXE installer with disc selection
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          $payload = (Resolve-Path build/runtime).Path
          $output = Join-Path $PWD 'build/artifacts/HarvestMoonBTN-windows-x64-setup.exe'
          & $nsis "/DPAYLOAD=$payload" "/DOUTPUT=$output" port/packaging/windows.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash = (Get-FileHash $output -Algorithm SHA256).Hash.ToLower()
          "$hash  HarvestMoonBTN-windows-x64-setup.exe" | Out-File -Encoding ascii build/artifacts/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: HarvestMoonBTN-windows-x64
          path: |
            build/artifacts/*setup.exe
            build/artifacts/SHA256SUMS-windows.txt
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [linux, windows]
    if: ${{ always() && inputs.publication == 'Release' && (needs.linux.result == 'success' || needs.windows.result == 'success') && (needs.linux.result == 'success' || needs.linux.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HarvestMoonBTN-*
          path: release-files
          merge-multiple: true
      - name: Publish selected packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" release-files/* --target "$TARGET_COMMIT" --title "Harvest Moon BTN $RELEASE_TAG" --generate-notes
